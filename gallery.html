<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Glamour Beauty Salon & Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <section class="page-banner" style="--banner: url('https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?w=1600&q=80')">
    <div class="container">
      <span class="script">Our Work</span>
      <h1>Gallery</h1>
      <div class="breadcrumb"><a href="index.html">Home</a><span>/</span>Gallery</div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-title reveal">
        <span class="script">Beautiful Transformations</span>
        <h2>Our Portfolio</h2>
        <div class="line"></div>
      </div>

      <div class="filters">
        <button class="active" data-filter="all">All</button>
        <button data-filter="hair">Hair</button>
        <button data-filter="makeup">Makeup</button>
        <button data-filter="bridal">Bridal</button>
        <button data-filter="nails">Nails</button>
        <button data-filter="salon">Salon</button>
      </div>

      <div class="gallery-grid">
        <div class="gallery-item" data-cat="hair"><img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600&q=80" alt="Hair styling" /></div>
        <div class="gallery-item" data-cat="makeup"><img src="https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?w=600&q=80" alt="Makeup look" /></div>
        <div class="gallery-item" data-cat="bridal"><img src="https://images.unsplash.com/photo-1519699047748-de8e457a634e?w=600&q=80" alt="Bridal look" /></div>
        <div class="gallery-item" data-cat="nails"><img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?w=600&q=80" alt="Nail art" /></div>
        <div class="gallery-item" data-cat="salon"><img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?w=600&q=80" alt="Salon interior" /></div>
        <div class="gallery-item" data-cat="hair"><img src="https://images.unsplash.com/photo-1562322140-8baeececf3df?w=600&q=80" alt="Hair colouring" /></div>
        <div class="gallery-item" data-cat="makeup"><img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=600&q=80" alt="Makeup products" /></div>
        <div class="gallery-item" data-cat="salon"><img src="https://images.unsplash.com/photo-1600948836101-f9ffda59d250?w=600&q=80" alt="Salon station" /></div>
        <div class="gallery-item" data-cat="hair"><img src="https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=600&q=80" alt="Hair look" /></div>
        <div class="gallery-item" data-cat="makeup"><img src="https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=600&q=80" alt="Skincare" /></div>
        <div class="gallery-item" data-cat="salon"><img src="https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?w=600&q=80" alt="Salon" /></div>
        <div class="gallery-item" data-cat="salon"><img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?w=600&q=80" alt="Salon chairs" /></div>
      </div>
    </div>
  </section>

  <section class="cta">
    <div class="container">
      <span class="script">Love What You See?</span>
      <h2>Your Transformation Awaits</h2>
      <p>Book now and be our next gallery star.</p>
      <a href="contact.html#booking" class="btn btn-white">Book Appointment</a>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
